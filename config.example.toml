# Global OAuth model name aliases (per channel)
# Supported channels: gemini-cli, vertex, aistudio, antigravity, claude, codex, kimi.
# [oauth-model-alias]
# gemini-cli  = [ { name = "gemini-2.5-pro", alias = "g2.5p", fork = true } ]
# vertex      = [ { name = "gemini-2.5-pro", alias = "g2.5p" } ]
# aistudio    = [ { name = "gemini-2.5-pro", alias = "g2.5p" } ]
# antigravity = [ { name = "gemini-3-pro-high", alias = "gemini-3-pro-preview" } ]
# claude      = [ { name = "claude-sonnet-4-5-20250929", alias = "cs4.5" } ]
# codex       = [ { name = "gpt-5", alias = "g5" } ]
# kimi        = [ { name = "kimi-k2.5", alias = "k2.5" } ]

# OAuth provider excluded models
# [oauth-excluded-models]
# gemini-cli = [
#   "gemini-2.5-pro",
#   "gemini-2.5-*",
#   "*-preview",
#   "*flash*",
# ]
# vertex      = ["gemini-3-pro-preview"]
# aistudio    = ["gemini-3-pro-preview"]
# antigravity = ["gemini-3-pro-preview"]
# claude      = ["claude-3-5-haiku-20241022"]
# codex       = ["gpt-5-codex-mini"]
# kimi        = ["kimi-k2-thinking"]

# Optional payload configuration
# [payload]
# # Default rules only set parameters when they are missing in the payload.
# [[payload.default]]
# models = [ { name = "gemini-2.5-pro", protocol = "gemini" } ]
# params = { "generationConfig.thinkingConfig.thinkingBudget" = 32768 }
#
# [[payload.default-raw]]
# models = [ { name = "gemini-2.5-pro", protocol = "gemini" } ]
# params = { "generationConfig.responseJsonSchema" = '{"type":"object","properties":{"answer":{"type":"string"}}}' }
#
# [[payload.override]]
# models = [ { name = "gpt-*", protocol = "codex" } ]
# params = { "reasoning.effort" = "high" }
#
# [[payload.override-raw]]
# models = [ { name = "gpt-*", protocol = "codex" } ]
# params = { "response_format" = '{"type":"json_schema","json_schema":{"name":"answer","schema":{"type":"object"}}}' }
